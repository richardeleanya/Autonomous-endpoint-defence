services:
  integration-tests:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: ["python", "-B", "-m", "unittest", "discover", "-s", "/tests", "-v"]
    working_dir: /repo
    network_mode: none
    read_only: true
    volumes:
      - ../../contracts:/repo/contracts:ro
      - ./test_binding.py:/tests/test_binding.py:ro
